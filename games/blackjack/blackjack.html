const profCache={};
async function prof(n){if(n===me)return;if(profCache[n])return;profCache[n]={displayName:"",pfp:"",decor:""};
 try{const v=(await get(ref(db,"profiles/"+n))).val()||{};profCache[n]={displayName:String(v.displayName||"").slice(0,32),pfp:safeImg(v.pfp),decor:okDecor(v.decor)?v.decor:""};if(room)renderAll()}catch{}}
const P=n=>n===me?myProf:(profCache[n]||(prof(n),{displayName:"",pfp:"",decor:""}));
function avatar(n,size){const p=P(n)||{},w=h("div","av");if(size)w.style.setProperty("--s",size);
 const i=h("img","pf");i.alt="";i.src=p.pfp||letterAv(n);i.onerror=()=>{i.onerror=null;i.src=letterAv(n)};
 const d=h("img","dc");d.alt="";d.hidden=!p.decor;if(p.decor){d.src=DECOR_DIR+encodeURIComponent(p.decor);d.onerror=()=>{d.onerror=null;d.src=DECOR_CDN+encodeURIComponent(p.decor)}}
 w.append(i,d);return w}
const dn=n=>(P(n)||{}).displayName||n;

/* ---------- firebase (loaded lazily so solo works offline) ---------- */
let ref,get,onValue,set,remove,runTransaction,push,onChildAdded,query,limitToLast,db,fbOk=false,all={};
async function initFB(){
 try{
  const V="10.12.2",G="https://www.gstatic.com/firebasejs/"+V+"/";
  const [A,D,U]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-database.js"),import(G+"firebase-auth.js")]);
  ({ref,get,onValue,set,remove,runTransaction,push,onChildAdded,query,limitToLast}=D);
  const app=ACTIVE==="main"?A.initializeApp(CFG):A.initializeApp(CFG,ACTIVE);db=D.getDatabase(app);fbOk=true;
  U.onAuthStateChanged(U.getAuth(app),u=>{if(!u&&!roomId)toast("signed out of wolfchat — sign in there to play 2 player",4000)});
  onValue(ref(db,BASE),s=>{all=s.val()||{};if(!roomId&&mode==="menu")renderMenu()});
  prof(me);
 }catch{fbOk=false;renderMenu()}
}

/* ---------- views ---------- */
let mode="menu",roomId=null,room=null,roomUn=null,chatUn=null,lastN=-1;
const show=id=>document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id===id));
function renderMenu(){mode="menu";show("vMenu");tell("in the lobby");
 $("who").textContent=me?`playing as ${myProf.displayName||me} (@${me})`:"not logged in to wolfchat · solo only";
 $("bCreate").disabled=!me||!fbOk;
 const box=$("rooms");box.replaceChildren();
 if(!me){box.append(h("div","empty","log in to wolfchat to play with a friend."));return}
 if(!fbOk){box.append(h("div","empty","connecting to the game server…"));return}
 const open=Object.entries(all).filter(([,g])=>g&&g.type==="blackjack"&&g.st==="open"&&Date.now()-(g.ts||0)<30*60e3);
 if(!open.length){box.append(h("div","empty","no open games. create one and a friend can join from here."));return}
 open.forEach(([id,g])=>{const c=Object.keys(g.pl||{}).length,r=h("div","rm");r.append(h("span","",`${g.host}'s table · ${c}/2`));
  const b=h("button","btn",g.pl?.[me]?"rejoin":"join");if(c>=2&&!g.pl?.[me])b.disabled=true;b.onclick=()=>joinGame(id);r.append(b);box.append(r)})}

/* ---------- unified table painter ---------- */
function paint(m){
 show("vGame");
 {const T=$("title");if(T._v!==m.title){T.textContent=m.title||"";re(T,"mp");T._v=m.title}}$("sub").textContent=m.sub||"";
 lb($("topLb"),m.top.lbl,m.top.tot);lb($("botLb"),m.bot.lbl,m.bot.tot);
 const nT=$("topHand").children.length,nB=$("botHand").children.length;
 fill($("topHand"),m.top.cards,i=>m.top.hide||(m.top.hideFrom!=null&&i>=m.top.hideFrom));fill($("botHand"),m.bot.cards,()=>false);
 if(m.top.cards.length+m.bot.cards.length>nT+nB)sfx.card();
 {const e=$("msg2");if(e._v!==m.msg){e.textContent=m.msg||"";re(e,"mp");e._v=m.msg}}
 const pl=$("plist");pl.replaceChildren();
 (m.players||[]).forEach(p=>{const c=h("div","pc"+(p.act?" act":""));c.append(p.name?avatar(p.name):Object.assign(h("div","av"),{innerHTML:'<img class="pf" alt="" src="'+letterAv("D")+'">'}));
  const d=h("div");d.append(h("div","nm ol sm",p.label));
  if(p.wins!=null){const hs=h("div","hs");for(let i=0;i<WIN;i++){const s=heart();if(i>=p.wins)s.classList.add("lost");hs.append(s)}d.append(hs)}else if(p.txt)d.append(h("div","",p.txt));
  c.append(d);pl.append(c)});
 const sa=$("stageAv");sa.replaceChildren();
 if(m.stage)sa.append(avatar(m.stage));else sa.append(Object.assign(h("div","av"),{innerHTML:'<img class="pf" alt="" src="'+letterAv("D")+'">'}));
 $("stageName").textContent=m.stageLbl||"";if(sa._v!==(m.stage||"d")){re(sa,"bounce");sa._v=m.stage||"d"}
 const hb=$("hearts");hb.replaceChildren();
 if(m.pips!=null)for(let i=0;i<WIN;i++){const s=heart();s.classList.add("heart");if(i>=m.pips)s.classList.add("lost");else if(i===m.pips-1&&(hb._n||0)<m.pips)s.classList.add("pop");hb.append(s)}
 hb._n=m.pips||0;const dk=$("dock");dk.replaceChildren();
 (m.dock||[]).forEach(([t,fn,cls,dis])=>{const b=h("button","btn "+(cls||""),t);b.disabled=!!dis;b.onclick=fn;dk.append(b)});
 const lv=$("bLeaveG");lv.onclick=m.leave;
}

/* ---------- SOLO ---------- */
let S=null;
const sdraw=()=>{if(S.dk.length<12)S.dk=shuf();return S.dk.pop()};
function soloStart(){mode="solo";tell("solo vs dealer");S={bank:500,bet:0,ph:"bet",p:[],d:[],dk:shuf(),msg:"place your bet"};renderSolo()}
function renderSolo(){
 const play=S.ph==="play",dock=[];
 if(S.ph==="bet"){[10,25,50,100].forEach((v,i)=>dock.push([String(v),()=>{S.bet+=v;renderSolo()},"chip"+(i%2?" k":""),S.bank-S.bet<v]));
  dock.push(["clear",()=>{S.bet=0;renderSolo()},"dk",!S.bet],["deal",sDeal,"go",!S.bet])}
 else if(play)dock.push(["hit",()=>{S.p.push(sdraw());const t=tot(S.p);t>21?sEnd("bust! dealer wins",-1):t===21?sStand():renderSolo()},"go"],["stand",sStand,"dk"],["double",()=>{S.bank-=0;S.bet*=2;S.p.push(sdraw());tot(S.p)>21?sEnd("bust on double!",-1):sStand()},"dk",!(S.p.length===2&&S.bank>=S.bet*2)]);
 else dock.push([S.bank<10?"restart":"next hand",()=>{if(S.bank<10)return soloStart();S.bet=0;S.p=[];S.d=[];S.ph="bet";S.msg="place your bet";renderSolo()},"go"]);
 paint({title:"you vs the dealer",sub:`chips $${S.bank} · bet $${S.bet}`,
  top:{lbl:"dealer",tot:S.d.length?(play?"?":tot(S.d)):"-",cards:S.d,hideFrom:play?1:null},
  bot:{lbl:"you",tot:S.p.length?tot(S.p):"-",cards:S.p},msg:S.msg,dock,
  players:[{name:me,label:me?dn(me):"you",txt:"$"+S.bank,act:play},{name:null,label:"dealer",txt:"hits to 17",act:S.ph==="done"}],
  stage:me,stageLbl:me?dn(me):"you",leave:()=>renderMenu()})}
function sDeal(){S.bank-=0;S.p=[sdraw(),sdraw()];S.d=[sdraw(),sdraw()];S.ph="play";S.msg="your move";
 if(isBJ(S.p)||isBJ(S.d)){if(isBJ(S.p)&&isBJ(S.d))sEnd("both blackjack: push",0);else if(isBJ(S.p))sEnd("BLACKJACK! pays 3:2",1.5);else sEnd("dealer blackjack",-1);return}renderSolo()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function sStand(){S.ph="done";S.msg="dealer plays…";renderSolo();
 while(tot(S.d)<17){await sleep(700);if(mode!=="solo")return;S.d.push(sdraw());renderSolo()}
 await sleep(500);if(mode!=="solo")return;const p=tot(S.p),d=tot(S.d);
 if(d>21)sEnd("dealer busts! you win",1);else if(p>d)sEnd("you win!",1);else if(p<d)sEnd("dealer wins",-1);else sEnd("push",0)}
function sEnd(m,mult){S.ph="done";const g=Math.round(S.bet*mult);S.bank+=g;S.msg=m+(mult?` (${g>0?"+":"-"}$${Math.abs(g)})`:"");if(S.bank<10)S.msg+=" · out of chips";mult>0?sfx.win():mult<0&&sfx.bad();renderSolo();
 if(mult>0){banner(mult>1?"BLACKJACK!":"YOU WIN!");confetti(mult>1?90:50);floatTxt("+$"+g,"#ffd23f")}else if(mult<0){shake();if(/bust/.test(m))banner("BUST!");floatTxt("-$"+Math.abs(g),"#e11d2e")}else banner("PUSH")}

/* ---------- 2 PLAYER (firebase) ---------- */
const rref=id=>ref(db,`${BASE}/${id||roomId}`);
const tx=fn=>runTransaction(rref(),cur=>cur===null?cur:fn(cur)).catch(()=>{});
const oth=(g,n)=>g.ord.find(x=>x!==n);
function deal(g){const d=shuf();g.hd={};g.dn={};g.ord.forEach(n=>{g.hd[n]=[d.pop(),d.pop()];g.dn[n]=tot(g.hd[n])===21});g.dk=d;g.ph="play";g.lg="";g.n=(g.n||0)+1;
 const f=g.ord[g.first||0],o=g.ord[1-(g.first||0)];g.turn=null;if(!g.dn[f])g.turn=f;else if(!g.dn[o])g.turn=o;else fin(g);return g}
function adv(g,from){const o=oth(g,from);if(!g.dn[o])g.turn=o;else if(!g.dn[from])g.turn=from;else fin(g)}
function fin(g){const[a,b]=g.ord,x=tot(g.hd[a]),y=tot(g.hd[b]),sa=x>21?-1:x,sb=y>21?-1:y;let w=null;if(sa>sb)w=a;else if(sb>sa)w=b;
 g.ph="result";g.turn=null;g.w=g.w||{};
 g.lg=w?`${w} wins the round (${x>21?"bust":x} vs ${y>21?"bust":y})`:`push (${x>21?"bust":x} vs ${y>21?"bust":y})`;
 if(w){g.w[w]=(g.w[w]||0)+1;if(g.w[w]>=WIN){g.st="done";g.win=w;g.lg+=` · match to ${w}!`}}}
async function createGame(){if(!me||!fbOk)return;const id=push(ref(db,BASE)).key;
 try{await set(rref(id),{type:"blackjack",host:me,st:"open",ts:Date.now(),pl:{[me]:true},n:0});listenRoom(id)}catch{toast("couldn't create (check firebase rules for games/)",4000)}}
async function joinGame(id){if(!me)return;const r=await runTransaction(rref(id),g=>{if(!g||g.st!=="open")return;g.pl=g.pl||{};if(!g.pl[me]&&Object.keys(g.pl).length>=2)return;g.pl[me]=true;return g}).catch(()=>null);
 if(r?.committed)listenRoom(id);else toast("can't join that game")}
function startGame(){if(!room||room.host!==me)return;tx(g=>{if(g.st!=="open")return;const o=Object.keys(g.pl||{});if(o.length<2)return;
 g.ord=[g.host,o.find(x=>x!==g.host)];g.w={[g.ord[0]]:0,[g.ord[1]]:0};g.first=0;g.st="live";g.win=null;g.n=0;return deal(g)})}
function hit(){const n=room.n;tx(g=>{if(g.n!==n||g.ph!=="play"||g.turn!==me)return;g.hd[me]=[...g.hd[me],g.dk.pop()];const v=tot(g.hd[me]);g.n++;
 if(v>=21){g.dn[me]=true;g.lg=v>21?`${me} busts`:`${me} hit 21`;adv(g,me)}return g})}
function stand(){const n=room.n;tx(g=>{if(g.n!==n||g.ph!=="play"||g.turn!==me)return;g.dn[me]=true;g.n++;g.lg=`${me} stands`;adv(g,me);return g})}
function nextRound(){const n=room.n;tx(g=>{if(g.n!==n||g.ph!=="result"||g.st!=="live")return;g.first=1-(g.first||0);return deal(g)})}
async function leaveGame(){const id=roomId,g=room;
 if(g&&g.st==="open"){if(g.host===me){await remove(rref(id)).catch(()=>{});remove(ref(db,`${CHAT}/${id}`)).catch(()=>{})}else await tx(c=>{if(c.pl)delete c.pl[me];return c})}
 else if(g&&g.st==="live"){await tx(c=>{if(c.st!=="live")return;c.st="done";c.win=oth(c,me);c.lg=`${me} left`;c.n++;return c})}
 else if(g&&g.st==="done"&&g.host===me){await remove(rref(id)).catch(()=>{});remove(ref(db,`${CHAT}/${id}`)).catch(()=>{})}
 leaveView()}
function listenRoom(id){roomUn?.();roomId=id;room=null;lastN=-1;startChat(id);mode="mp";
 roomUn=onValue(rref(),s=>{room=s.val();if(!room){if(roomId){toast("game closed");leaveView()}return}renderAll()})}
function leaveView(){stopChat();roomUn?.();roomUn=null;roomId=null;room=null;$("over").classList.remove("on");renderMenu()}
function renderAll(){if(!room)return;(room.ord||Object.keys(room.pl||{})).forEach(n=>P(n));if(room.st==="open")return renderWait();renderMP()}
function renderWait(){show("vWait");tell("waiting for a player");$("over").classList.remove("on");
 const box=$("lobbyPlayers");box.replaceChildren();const pl=Object.keys(room.pl||{});
 pl.forEach(n=>{const d=h("div","lp");d.append(avatar(n),h("div","ol sm",dn(n)+(n===room.host?" ★":"")));box.append(d)});
 for(let i=pl.length;i<2;i++)box.append(h("div","slot","?"));
 const host=room.host===me;$("bStart").style.display=host?"":"none";$("bStart").disabled=pl.length<2;
 $("waitHint").textContent=pl.length<2?"your friend can join from the blackjack lobby — they’ll see your table in the list":host?"ready! you go first":`waiting for ${room.host} to start…`}
function renderMP(){const g=room,live=g.st==="live",res=g.ph==="result"||g.st==="done",opp=oth(g,me),mine=g.turn===me&&live&&g.ph==="play";
 tell("2 player match");
 const mh=g.hd?.[me]||[],oh=g.hd?.[opp]||[];
 const dock=[];if(mine){dock.push(["hit",hit,"go"],["stand",stand,"dk"])}else if(g.ph==="result"&&live)dock.push([`next round (${dn(oth(g,g.ord[g.first||0]))} starts)`,nextRound,"go"]);
 const msg=live&&g.ph==="play"?(mine?"your move":`waiting for ${dn(g.turn)}…`)+(g.lg?" · "+g.lg:""):g.lg;
 const fire=g.n!==lastN&&lastN!==-1&&res;lastN=g.n;
 paint({title:mine?"your turn":live?`${dn(g.turn||opp)}’s turn`:"match over",sub:`first to ${WIN} round wins`,
  top:{lbl:dn(opp),tot:res?tot(oh):"?",cards:oh,hide:!res},bot:{lbl:"you",tot:mh.length?tot(mh):"-",cards:mh},msg,dock,
  players:g.ord.map(n=>({name:n,label:dn(n),wins:g.w?.[n]||0,act:n===g.turn&&live})),
  stage:g.turn||me,stageLbl:dn(g.turn||me),pips:g.w?.[me]||0,leave:()=>{if(live&&!confirm("leave the match? you'll forfeit."))return;leaveGame()}});
 if(fire){const iw=(g.lg||"").startsWith(me+" wins"),ow=(g.lg||"").startsWith(opp+" wins");
  if(iw){sfx.win();banner(g.st==="done"?"MATCH WON!":"ROUND WON!");confetti(g.st==="done"?100:45)}else if(ow){sfx.bad();shake();banner(g.st==="done"?"MATCH LOST":"ROUND LOST")}else if((g.lg||"").startsWith("push"))banner("PUSH")}
 const ov=$("over");
 if(g.st==="done"){ov.classList.add("on");$("overAv").replaceChildren();if(g.win)$("overAv").append(avatar(g.win));$("overTxt").textContent=g.win===me?"you win!":`${dn(g.win)} wins!`;$("overSub").textContent=g.lg||""}else ov.classList.remove("on")}

/* ---------- chat ---------- */
const hue=n=>{let x=0;for(const c of n)x=(x*31+c.charCodeAt(0))%360;return x};
let unread=0,lastSend=0;const chatEl=$("chat"),chatLog=$("chatLog"),chatIn=$("chatIn");
function paintBadge(){const b=$("chatBadge");b.textContent=unread>9?"9+":unread;b.classList.toggle("on",unread>0&&chatEl.classList.contains("min"))}
function setMin(v){chatEl.classList.toggle("min",v);if(!v){unread=0;paintBadge();chatLog.scrollTop=chatLog.scrollHeight}}
function addMsg(m){if(!m||typeof m.n!=="string"||typeof m.x!=="string")return;chatLog.querySelector(".em")?.remove();
 const d=h("div","m"+(m.n===me?" me":"")),b=h("b","",m.n===me?"you":(profCache[m.n]?.displayName||m.n));b.style.color=`hsl(${hue(m.n)} 90% 75%)`;d.append(b,document.createTextNode(m.x.slice(0,120)));
 chatLog.append(d);while(chatLog.children.length>60)chatLog.firstChild.remove();chatLog.scrollTop=chatLog.scrollHeight;
 if(m.n!==me&&chatEl.classList.contains("min")){unread++;paintBadge()}}
function startChat(id){stopChat();chatLog.replaceChildren(h("div","em","say hi 👋"));unread=0;paintBadge();chatEl.style.display="flex";setMin(innerWidth<700||innerHeight<560);
 chatUn=onChildAdded(query(ref(db,`${CHAT}/${id}`),limitToLast(40)),s=>addMsg(s.val()),()=>{})}
function stopChat(){chatUn?.();chatUn=null;chatEl.style.display="none"}
function sendChat(){const x=chatIn.value.trim().slice(0,120);if(!x||!roomId)return;if(Date.now()-lastSend<700)return;lastSend=Date.now();chatIn.value="";
 push(ref(db,`${CHAT}/${roomId}`),{n:me,x,ts:Date.now()}).catch(()=>toast("chat message failed to send",2500))}
$("chatHd").onclick=()=>setMin(!chatEl.classList.contains("min"));
chatIn.addEventListener("keydown",e=>{e.stopPropagation();if(e.key==="Enter"){e.preventDefault();sendChat()}else if(e.key==="Escape")chatIn.blur()});

/* ---------- wiring ---------- */
$("bSolo").onclick=soloStart;$("bCreate").onclick=createGame;$("bStart").onclick=startGame;$("bLeaveW").onclick=leaveGame;$("bBack").onclick=leaveGame;
renderMenu();
if(me)initFB();
</script>
