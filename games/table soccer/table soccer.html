<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>table soccer.</title>
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<style>
:root{--bd:#1e3a8a;--tx:#c7d2fe;--glow:#3b82f6;--blue:#2563eb;--red:#e8453c}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;font-family:'Minecraftia',monospace;color:var(--tx);overflow:hidden}
body{background:linear-gradient(270deg,#000,#020617,#020617,#000);background-size:400% 400%;animation:bgFade 12s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px}
@keyframes bgFade{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.55;background-size:300px 200px;animation:drift 90s linear infinite;background-image:radial-gradient(1px 1px at 20px 30px,#93c5fd,transparent),radial-gradient(1px 1px at 120px 80px,#fff,transparent),radial-gradient(2px 2px at 210px 150px,#3b82f6,transparent),radial-gradient(1px 1px at 260px 40px,#bfdbfe,transparent)}
@keyframes drift{to{background-position:-300px 400px}}
.logo{font-size:10px;line-height:1;animation:flicker 5s infinite}.logo span{color:var(--glow)}
@keyframes flicker{0%,92%,100%{text-shadow:0 0 8px var(--glow)}94%{text-shadow:none}96%{text-shadow:0 0 14px var(--glow)}}
#hud{display:flex;align-items:center;gap:10px;font-size:10px}
.pl{display:flex;align-items:center;gap:6px;max-width:110px}.pl img,.pl .av{width:26px;height:26px;flex:none;border:2px solid var(--bd);border-radius:4px;object-fit:cover;background:#000;display:flex;align-items:center;justify-content:center}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{min-width:2.2ch;text-align:center;padding:4px 9px;border-radius:4px;font-size:20px;box-shadow:0 0 12px currentColor}.sc b{color:#fff}
.sc.bump{animation:bump .5s}@keyframes bump{30%{transform:scale(1.6) rotate(-6deg)}100%{transform:none}}
#sub{font-size:9px;opacity:.8}#sub:empty{display:none}
#pill{padding:4px 14px;border-radius:20px;background:#0f172a;border:1px solid var(--bd);font-size:11px;transition:.3s}
#pill.me{background:var(--blue);color:#fff;box-shadow:0 0 14px var(--glow);animation:pp 1.2s infinite}@keyframes pp{50%{transform:scale(1.07)}}
#wrap{position:relative;height:min(calc(100vh - 104px),calc(100dvh - 104px),calc((100vw - 8px)*1.565));aspect-ratio:460/720;border:3px solid var(--bd);border-radius:6px;box-shadow:0 0 24px rgba(59,130,246,.35);overflow:hidden;touch-action:none;background:#000}
canvas{width:100%;height:100%;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,23,.75);padding:8px;overflow:auto}
.card{background:#020617;border:2px solid var(--bd);padding:14px;text-align:center;width:100%;display:flex;flex-direction:column;gap:8px;font-size:10px;line-height:1.5;animation:pop .35s ease-out;box-shadow:0 0 18px rgba(59,130,246,.3)}
.card h1{font-size:15px;text-shadow:0 0 8px var(--glow)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(14px)}to{opacity:1;transform:none}}
button,input{font:inherit;font-size:10px;padding:9px 10px;border:1px solid var(--bd);background:#0f172a;color:var(--tx);border-radius:4px;text-transform:lowercase}
button{cursor:pointer;transition:.15s}button:hover:not(:disabled){background:var(--bd);transform:translateY(-1px);box-shadow:0 0 10px rgba(59,130,246,.4)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--blue);border-color:var(--blue);color:#fff}
input{text-align:center;text-transform:uppercase;letter-spacing:3px;width:100%}
.row{display:flex;gap:6px}#lob{display:flex;flex-direction:column;gap:5px;max-height:80px;overflow:auto}
#msg{position:absolute;top:42%;left:0;right:0;text-align:center;font-size:clamp(24px,9vw,44px);color:#fff;text-shadow:0 0 18px var(--glow),0 4px 0 #000;pointer-events:none}
#msg.pop{animation:mp .6s ease-out}@keyframes mp{0%{transform:scale(.2) rotate(-8deg);opacity:0}50%{transform:scale(1.3) rotate(3deg);opacity:1}100%{transform:none}}
.low{background:#dc2626!important;border-color:#dc2626!important}.hide{display:none!important}.warn{color:#fca5a5}
#hud{background:linear-gradient(#0b1230cc,#050a1ecc);border:1px solid var(--bd);border-radius:12px;padding:3px 12px;box-shadow:0 0 16px rgba(37,99,235,.25)}
#wrap{border-radius:14px;border:3px solid #1d4ed8;box-shadow:0 0 0 2px #020617,0 0 30px rgba(59,130,246,.5),inset 0 0 30px #0008}
button.pri{background:linear-gradient(#3b82f6,#1d4ed8);box-shadow:0 0 12px rgba(59,130,246,.5)}
.card{border-radius:12px;background:linear-gradient(#08102a,#020617)}
.ball{display:inline-block;animation:bounce 1s infinite}@keyframes bounce{50%{transform:translateY(-6px) rotate(180deg)}}
.pl img,.pl .av{border-radius:50%}
#tbar{width:min(300px,80vw);height:6px;background:#0f172a;border-radius:3px;overflow:hidden;border:1px solid var(--bd)}#tfill{display:block;height:100%;width:100%;transform-origin:left;background:#22c55e}
</style>
</head>
<body>
<div class="stars"></div>
<div class="logo">table <span>soccer.</span></div>
<div id="hud"></div>
<div id="sub"></div>
<div id="wrap">
  <canvas id="c" width="460" height="720"></canvas>
  <div id="msg"></div>
  <div id="ov"><div class="card" id="menu"></div></div>
</div>
<div id="pill"></div>
<div id="tbar"><i id="tfill"></i></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,set,get,onValue,remove,onDisconnect,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import {getAuth,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// ---- wolfchat account link (same Firebase project + active-account logic as wolfchat's index.html) ----
const CFG={apiKey:"AIzaSyBg5DGLubsHuH3ub3AtzpRenSMH6x1hZPs",authDomain:"wolfchatlol.firebaseapp.com",databaseURL:"https://wolfchatlol-default-rtdb.firebaseio.com",projectId:"wolfchatlol",storageBucket:"wolfchatlol.firebasestorage.app",messagingSenderId:"654485297853",appId:"1:654485297853:web:b1b93e7d7cef780fd275d4"};
const ACTIVE=localStorage.getItem("wc_active")||"main";
const app=ACTIVE==="main"?initializeApp(CFG):initializeApp(CFG,ACTIVE);
const db=getDatabase(app),auth=getAuth(app);
let me=null;try{me=JSON.parse(localStorage.getItem(ACTIVE==="main"?"wc_profile":"wc_profile_"+ACTIVE))}catch{}
let authed=false;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---- constants ----
const W=400,H=640,PR=19,BR=8,GW=100,WIN=3,MX=30,MY=40,CW=460,CH=720,MAXV=950,DT=1/240;
const COL=['#2563eb','#e8453c'];
const FORM=[[200,H-34],[105,H-130],[295,H-130],[200,H-200],[110,H-290],[290,H-290]];
const POSTS=[[W/2-GW/2,0],[W/2+GW/2,0],[W/2-GW/2,H],[W/2+GW/2,H]];

// ---- state ----
const B=Array.from({length:13},(_,i)=>({x:0,y:0,vx:0,vy:0,r:i===12?BR:PR,m:i===12?1:3}));
const TL=30,CAP=4;
let carrier=-1,chain=0,tLeft=30,snap={dx:0,dy:0,k:0};
let role=null,code='',turn=0,score=[0,0],win=-1,seq=0,busy=false,sim=null,pending=null,lastShot=0,ended=false;
let names=['blue','red'],pfps=['',''],label='',curLabel='',botT=0,drag=null,shownScore=[0,0];
const myIdx=()=>role==='guest'?1:0;
function layout(){FORM.forEach(([x,y],i)=>{B[i].x=x;B[i].y=y;B[i+6].x=W-x;B[i+6].y=H-y});B[12].x=W/2;B[12].y=H/2;B.forEach(b=>b.vx=b.vy=0)}
const pack=()=>[...B.flatMap(b=>[+b.x.toFixed(1),+b.y.toFixed(1)])];
function unpack(p){B.forEach((b,i)=>{b.x=p[i*2];b.y=p[i*2+1];b.vx=b.vy=0})}

// ---- physics ----
function hit(a,b,ima,imb,e){
  const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),rs=a.r+b.r;if(d>=rs||d===0)return;
  const nx=dx/d,ny=dy/d,ov=rs-d,t=ima+imb;
  a.x-=nx*ov*ima/t;a.y-=ny*ov*ima/t;b.x+=nx*ov*imb/t;b.y+=ny*ov*imb/t;
  const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn>=0)return;
  const j=-(1+e)*vn/t;a.vx-=j*ima*nx;a.vy-=j*ima*ny;b.vx+=j*imb*nx;b.vy+=j*imb*ny;
  if(-vn>220){burst((a.x+b.x)/2,(a.y+b.y)/2,6,['#fde047','#fff'],180);ring((a.x+b.x)/2,(a.y+b.y)/2,'#ffffff',22)}
  a.pu=b.pu=1;
}
function stepPhys(dt){
  for(const b of B){const f=Math.pow(b.m===1?.3:.1,dt);b.vx*=f;b.vy*=f;b.x+=b.vx*dt;b.y+=b.vy*dt;
    const s=Math.hypot(b.vx,b.vy);if(s<7)b.vx=b.vy=0;else if(s>MAXV){b.vx*=MAXV/s;b.vy*=MAXV/s}}
  for(let i=0;i<12;i++){const b=B[i];
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.7}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.7}
    if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.7}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.7}}
  const bl=B[12];
  if(bl.x<BR){bl.x=BR;bl.vx=Math.abs(bl.vx)*.8}if(bl.x>W-BR){bl.x=W-BR;bl.vx=-Math.abs(bl.vx)*.8}
  if(Math.abs(bl.x-W/2)<GW/2){if(bl.y<0)return 0;if(bl.y>H)return 1}
  else{if(bl.y<BR){bl.y=BR;bl.vy=Math.abs(bl.vy)*.8}if(bl.y>H-BR){bl.y=H-BR;bl.vy=-Math.abs(bl.vy)*.8}}
  for(let i=0;i<13;i++)for(let j=i+1;j<13;j++){
    if(j===12&&sim&&sim.pj<0&&i!==sim.kicker&&(i<6?0:1)===sim.team&&chain<CAP&&Math.hypot(B[i].x-bl.x,B[i].y-bl.y)<PR+BR&&Math.hypot(bl.x-sim.bx,bl.y-sim.by)>=40){sim.pj=i;return -1}
    hit(B[i],B[j],1/B[i].m,1/B[j].m,.85)}
  for(const [px,py] of POSTS)hit(bl,{x:px,y:py,r:5,vx:0,vy:0},1,0,.8);
  return -1;
}
function startSim(team,i,vx,vy,q){const bl=B[12];
  if(carrier===i){bl.vx=vx;bl.vy=vy;carrier=-1}else{B[i].vx=vx;B[i].vy=vy}
  sim={team,t:0,acc:0,goal:-1,q,kicker:i,pj:-1,bx:bl.x,by:bl.y};drag=null;snap.k=0;ring(B[i].x,B[i].y,'#fde047',44)}
function carryOff(j){const o=(j<6?-1:1)*(PR+BR-3);return B[j].y+o<BR+2||B[j].y+o>H-BR-2?[0,-o]:[0,o]}
function takePoss(j){carrier=j;chain++;const o=carryOff(j),bl=B[12],tx=B[j].x+o[0],ty=B[j].y+o[1];
  snap={dx:bl.x-tx,dy:bl.y-ty,k:1};bl.x=tx;bl.y=ty;burst(tx,ty,14,['#fde047','#fff'],200);ring(tx,ty,'#fde047',40);
  label='nice pass!';setTimeout(()=>{if(label==='nice pass!')label=''},900)}
function simFrame(dt){
  sim.acc+=Math.min(dt,.05);
  while(sim&&sim.acc>=DT){sim.acc-=DT;sim.t+=DT;const g=stepPhys(DT);
    if(g>=0){sim.goal=g;return endSim()}
    if(sim.pj>=0)return endSim();
    if(B.every(b=>!b.vx&&!b.vy)||sim.t>12)return endSim()}
}
function endSim(){
  const s=sim;sim=null;B.forEach(b=>b.vx=b.vy=0);
  const auth=role==='bot'||s.team===myIdx();
  if(s.goal>=0){label='GOAL!';shake=.6;flash=1;cheer=1;netK=1;netSide=s.goal;ring(B[12].x,B[12].y,'#fde047',110);ring(B[12].x,B[12].y,'#fff',70);setTimeout(()=>{if(label==='GOAL!')label=''},3000);burst(W/2,s.goal?H:0,70,['#3b82f6','#e8453c','#fde047','#fff','#4ade80'],520);
    if(auth){busy=true;score[s.goal]++;if(score[s.goal]>=WIN)win=s.goal;
      setTimeout(()=>{if(win<0){label='';layout();turn=1-s.goal}carrier=-1;chain=0;tLeft=TL;seq=s.q;busy=false;publish();after()},3000)}
    else if(pending)applySt()}
  else if(s.pj>=0){takePoss(s.pj);if(auth){seq=s.q;tLeft=TL;publish();after()}else if(pending)applySt()}
  else if(auth){turn=1-s.team;carrier=-1;chain=0;tLeft=TL;seq=s.q;publish();after()}
  else if(pending)applySt();
}
function publish(){lastSt=seq;if(role!=='bot'&&role)set(rr('st'),{p:pack(),s:score,t:turn,w:win,q:seq,c:carrier,k:chain}).catch(()=>{})}
function applySt(){const d=pending;pending=null;if(!d)return;lastSt=d.q;unpack(d.p);score=d.s;turn=d.t;win=d.w;seq=d.q;carrier=d.c==null?-1:d.c;chain=d.k||0;tLeft=TL;snap.k=0;busy=false;label='';after()}
function after(){
  if(win>=0){label=names[win].toUpperCase()+' WINS!';finish();return}
  if(role==='bot'&&turn===1)botT=.9;
}

// ---- input (slingshot drag: pull back from your piece, release to flick) ----
const cv=$('c'),ctx=cv.getContext('2d');
const canAct=()=>role&&!sim&&!busy&&win<0&&turn===myIdx()&&$('ov').classList.contains('hide');
function pt(e){const r=cv.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*CW,y=(e.clientY-r.top)/r.height*CH;if(myIdx()===1){x=CW-x;y=CH-y}return[x-MX,y-MY]}
cv.addEventListener('pointerdown',e=>{if(!canAct())return;const[x,y]=pt(e);const o=myIdx()*6;let best=-1,bd=1e9;
  for(let i=o;i<o+6;i++){if(carrier>=0&&i!==carrier)continue;const d=Math.hypot(B[i].x-x,B[i].y-y);if(d<PR+14&&d<bd){bd=d;best=i}}
  if(best>=0){drag={i:best,x,y};cv.setPointerCapture(e.pointerId)}});
cv.addEventListener('pointermove',e=>{if(drag){const[x,y]=pt(e);drag.x=x;drag.y=y}});
cv.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(!canAct())return;
  const p=aimOf(d);if(p.pw<.1)return;commit(d.i,p.dx*p.pw*MAXV,p.dy*p.pw*MAXV)});
cv.addEventListener('pointercancel',()=>drag=null);
function aimOf(d){const b=B[d.i],ax=b.x-d.x,ay=b.y-d.y,l=Math.hypot(ax,ay)||1;return{dx:ax/l,dy:ay/l,pw:clamp(l/130,0,1)}}
function commit(i,vx,vy){
  vx=+vx.toFixed(2);vy=+vy.toFixed(2);const q=seq+1;lastShot=q;
  if(role!=='bot')set(rr('shot'),{q,i,vx,vy,tm:turn}).catch(()=>{});
  startSim(turn,i,vx,vy,q);
}
function botMove(){
  if(sim||busy||win>=0||turn!==1||role!=='bot')return;
  if(carrier>=0){const p=B[carrier],a=Math.atan2(H-p.y,W/2-p.x)+(Math.random()-.5)*.12;commit(carrier,Math.cos(a)*800,Math.sin(a)*800);return}
  const bl=B[12],dx=W/2-bl.x,dy=H-bl.y,dl=Math.hypot(dx,dy)||1,tx=bl.x-dx/dl*(PR+BR-3),ty=bl.y-dy/dl*(PR+BR-3);
  let best=6,bd=1e9;for(let i=6;i<12;i++){const d=Math.hypot(tx-B[i].x,ty-B[i].y);if(d<bd){bd=d;best=i}}
  const a=Math.atan2(ty-B[best].y,tx-B[best].x)+(Math.random()-.5)*.1,sp=clamp(bd*2.2+380,420,900);
  commit(best,Math.cos(a)*sp,Math.sin(a)*sp);
}

// ---- effects ----
let parts=[],trail=[],rings=[],shake=0,flash=0,cheer=.1,netK=0,netSide=0,ballRot=0;
function ring(x,y,c,max){rings.push({x,y,c,max,l:1})}
function burst(x,y,n,cols,sp=300){for(let i=0;i<n;i++){const a=Math.random()*7,v=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:cols[i%cols.length]})}}
function setLabel(t){if(t===curLabel)return;curLabel=t;const m=$('msg');m.textContent=t;m.classList.remove('pop');void m.offsetWidth;m.classList.add('pop')}

// ---- hud ----
function av(i){return pfps[i]?`<img src="${esc(pfps[i])}" alt="">`:`<span class="av">${esc((names[i]||'?')[0].toUpperCase())}</span>`}
function hud(){const l=myIdx(),r=1-l,pl=i=>`<span class="pl">${av(i)}<span class="nm">${esc(names[i])}</span></span>`,sc=i=>`<span class="sc" id="s${i}" style="background:${COL[i]};color:${COL[i]}"><b>${score[i]}</b></span>`;
  $('hud').innerHTML=`${pl(l)}${sc(l)}<span>:</span>${sc(r)}${pl(r)}`;$('sub').textContent='goals to win: '+WIN+' · 30s per turn'}
function bumpScores(){for(let i=0;i<2;i++)if(score[i]!==shownScore[i]){const up=score[i]>shownScore[i];shownScore[i]=score[i];hud();const e=$('s'+i);e&&up&&e.classList.add('bump')}}
let pillKey='';
function pill(){const mine=canAct(),act=!sim&&!busy,n=Math.max(0,Math.ceil(tLeft)),k=(win>=0?'o':!role?'':(mine?'m':(turn===myIdx()?'w':'t')))+(act?n:'');if(k===pillKey)return;pillKey=k;
  const p=$('pill'),t=act?' · '+n+'s':'';p.className=(mine?'me':'')+(mine&&n<=5?' low':'');
  p.textContent=win>=0?'match over':!role?'':mine?'your turn'+(carrier>=0?' · ball in hand':'')+t:turn===myIdx()?'…':names[turn]+'’s turn'+t}

// ---- online ----
const rr=p=>ref(db,'tsoc/rooms/'+code+(p?'/'+p:''));
async function loadOpp(name,i){names[i]=name;hud();try{const s=await get(ref(db,'profiles/'+name));if(s.exists()){const p=s.val();names[i]=p.displayName||name;pfps[i]=p.pfp||'';hud()}}catch{}}
async function finish(){
  if(ended)return;ended=true;if(role==='bot'){setTimeout(showEnd,1500);return}
  setTimeout(showEnd,1500);
  if(!authed)return;try{await runTransaction(ref(db,'tsoc/stats/'+me.name+'/'+(win===myIdx()?'w':'l')),c=>(c||0)+1)}catch{}
}
async function showEnd(){
  let rec='';if(role!=='bot')try{const s=(await get(ref(db,'tsoc/stats/'+me.name))).val()||{};rec=`<p>your record: ${s.w||0}w – ${s.l||0}l</p>`}catch{}
  $('ov').classList.remove('hide');
  $('menu').innerHTML=`<h1>${esc(label)}</h1><p>${score[0]} – ${score[1]}</p>${rec}<button class="pri" id="again">${role==='guest'?'ask for rematch':'play again'}</button><button id="leave">leave</button>`;
  $('leave').onclick=()=>location.reload();
  $('again').onclick=()=>{$('ov').classList.add('hide');if(role==='guest')set(rr('rm'),Date.now());else{newMatch(seq+1)}}}
function newMatch(q){layout();carrier=-1;chain=0;tLeft=TL;score=[0,0];win=-1;turn=0;ended=false;label='';busy=false;sim=null;pending=null;seq=q;shownScore=[0,0];hud();publish();after()}
function netErr(e){$('menu').innerHTML=`<h1>oops</h1><p class="warn">${esc(e.code||e.message||e)}</p><p>if this says permission_denied, your realtime database rules need to allow read/write on <b>tsoc</b>.</p><button id="back">back</button>`;$('back').onclick=menu}
function onShot(d){if(!d||d.q<=lastShot||sim)return;lastShot=d.q;startSim(d.tm,d.i,d.vx,d.vy,d.q)}
let lastSt=-1;
function onSt(d){if(!d||d.q===lastSt)return;pending=d;if(!sim&&!busy)applySt()}

async function create(){
  code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  try{await set(rr(),{host:{n:me.name},t:Date.now()});await set(ref(db,'tsoc/lobby/'+code),{n:me.name,t:Date.now()});
    onDisconnect(rr()).remove();onDisconnect(ref(db,'tsoc/lobby/'+code)).remove()}catch(e){return netErr(e)}
  role='host';names=[me.displayName||me.name,'waiting…'];layout();hud();
  $('menu').innerHTML=`<h1>room ${code}</h1><p>waiting for a wolfchat friend to join…</p><p>they open this page and tap your name or enter the code.</p><button id="cancel">cancel</button>`;
  $('cancel').onclick=()=>{remove(rr());remove(ref(db,'tsoc/lobby/'+code));location.reload()};
  let started=false;
  onValue(rr('guest'),s=>{const g=s.val();
    if(g&&!started){started=true;loadOpp(g.n,1);remove(ref(db,'tsoc/lobby/'+code));$('ov').classList.add('hide');newMatch(0)}
    else if(!g&&started){$('ov').classList.remove('hide');$('menu').innerHTML='<h1>opponent left</h1><button onclick="location.reload()">back</button>'}});
  onValue(rr('shot'),s=>onShot(s.val()));
  let rmv=null;onValue(rr('rm'),s=>{const v=s.val();if(rmv===null){rmv=v;return}if(v!==rmv){rmv=v;if(win>=0){$('ov').classList.add('hide');newMatch(seq+1)}}});
  loop()}
async function joinGame(c){
  c=c.toUpperCase().trim();if(c.length!==4)return;code=c;
  try{const s=await get(rr());if(!s.exists()||s.val().guest){$('err').textContent='room not found or full';return}
    await set(rr('guest'),{n:me.name});onDisconnect(rr('guest')).remove();
    role='guest';names=[s.val().host.n,me.displayName||me.name];loadOpp(s.val().host.n,0);pfps[1]=me.pfp||'';layout();hud()}catch(e){return netErr(e)}
  $('menu').innerHTML='<h1>joining…</h1>';let got=false;
  onValue(rr(),s=>{const v=s.val();
    if(!v){$('ov').classList.remove('hide');$('menu').innerHTML='<h1>host left</h1><button onclick="location.reload()">back</button>';return}
    if(v.st){if(!got){got=true;$('ov').classList.add('hide')}onSt(v.st)}
    if(v.shot)onShot(v.shot)});
  loop()}
function startBot(){role='bot';names=[me?.displayName||me?.name||'you','bot'];pfps=[me?.pfp||'',''];$('ov').classList.add('hide');newMatch(0);loop()}

// ---- menu ----
let lobUnsub=null;
function menu(){
  $('ov').classList.remove('hide');
  const acct=authed?`<p>playing as <b>${esc(me.displayName||me.name)}</b> (@${esc(me.name)})</p>`:`<p class="warn">sign in on wolfchat first to play online.<br>(keep this file next to wolfchat so the login is shared)</p><a href="./" style="color:var(--glow)">open wolfchat</a>`;
  $('menu').innerHTML=`<h1><span class="ball">⚽</span> table soccer</h1>${acct}<p>turn-based. pull back on a piece and let go to flick it at the ball. if the ball hits a different teammate, it sticks to them and you kick again. 30s per turn. first to ${WIN} goals wins.</p>
  <button class="pri" id="create" ${authed?'':'disabled'}>create game</button><div id="lob"></div>
  <div class="row"><input id="code" maxlength="4" placeholder="code"><button id="join" ${authed?'':'disabled'}>join</button></div>
  <button id="bot">practice vs bot</button><p id="err" class="warn"></p>`;
  $('create').onclick=create;$('join').onclick=()=>joinGame($('code').value);$('bot').onclick=startBot;
  if(authed){lobUnsub&&lobUnsub();lobUnsub=onValue(ref(db,'tsoc/lobby'),s=>{const l=$('lob');if(!l)return;const v=s.val()||{};l.innerHTML='';
    Object.entries(v).filter(([k,x])=>Date.now()-x.t<36e5&&x.n!==me.name).forEach(([k,x])=>{const b=document.createElement('button');b.textContent='play '+x.n;b.onclick=()=>joinGame(k);l.appendChild(b)})},()=>{})}
}

// ---- drawing ----
const FC=document.createElement('canvas');FC.width=W;FC.height=H;
const stands=['#c0392b','#2980b9','#f1c40f','#ecf0f1','#27ae60'];
let fdt=.016;
function buildField(){
  const g=FC.getContext('2d');let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
  for(let i=0;i<16;i++){const gr=g.createLinearGradient(0,i*40,0,i*40+40),a=i%2?['#2f9a52','#2a8c49']:['#3bb061','#33a257'];gr.addColorStop(0,a[0]);gr.addColorStop(1,a[1]);g.fillStyle=gr;g.fillRect(0,i*40,W,40)}
  for(let i=0;i<3000;i++){g.fillStyle=rnd()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';g.fillRect(rnd()*W,rnd()*H,1+rnd()*2,2+rnd()*3)}
  g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=3;g.strokeRect(1.5,1.5,W-3,H-3);
  const L=(a,b,c,d)=>{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
  L(0,H/2,W,H/2);g.beginPath();g.arc(W/2,H/2,62,0,7);g.stroke();
  g.strokeRect(W/2-75,1.5,150,100);g.strokeRect(W/2-75,H-101.5,150,100);g.strokeRect(W/2-36,1.5,72,40);g.strokeRect(W/2-36,H-41.5,72,40);
  g.beginPath();g.arc(W/2,100,34,.2,2.94);g.stroke();g.beginPath();g.arc(W/2,H-100,34,Math.PI+.2,Math.PI*2-.2);g.stroke();
  g.fillStyle='#fff';for(const[x,y,r]of[[W/2,H/2,4],[W/2,72,3],[W/2,H-72,3]]){g.beginPath();g.arc(x,y,r,0,7);g.fill()}
  for(const[x,y,a]of[[0,0,0],[W,0,Math.PI/2],[W,H,Math.PI],[0,H,Math.PI*1.5]]){g.beginPath();g.arc(x,y,14,a,a+Math.PI/2);g.stroke()}
  const v=g.createRadialGradient(W/2,H/2,H*.25,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,20,0,.38)');g.fillStyle=v;g.fillRect(0,0,W,H);
}
function drawField(t){
  for(let s=0;s<2;s++){const x0=s?W+6:-MX;ctx.fillStyle='#111827';ctx.fillRect(x0,-MY,MX-6,CH);
    for(let k=0;k<90;k++)for(let c=0;c<3;c++){const bob=Math.abs(Math.sin(t/170+k*.7+c))*cheer*5;ctx.globalAlpha=.75;ctx.fillStyle=stands[(k*3+c+s*7)%5];ctx.fillRect(x0+3+c*7,-MY+k*8+4-bob,5,5)}}
  ctx.globalAlpha=1;
  for(const[y,s]of[[-30,0],[H,1]]){
    ctx.fillStyle='#04070f';ctx.fillRect(W/2-GW/2,y,GW,30);ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;
    const bulge=netSide===s?netK*12*(s?1:-1):0;
    for(let k=0;k<=GW;k+=10){ctx.beginPath();ctx.moveTo(W/2-GW/2+k,y);ctx.lineTo(W/2-GW/2+k,y+30);ctx.stroke()}
    for(let k=0;k<=30;k+=6){ctx.beginPath();ctx.moveTo(W/2-GW/2,y+k);ctx.quadraticCurveTo(W/2,y+k+bulge*Math.sin(Math.min(1,(k+4)/30)*Math.PI),W/2+GW/2,y+k);ctx.stroke()}}
  ctx.drawImage(FC,0,0);
  for(const[x,y]of POSTS){ctx.fillStyle='#0005';ctx.beginPath();ctx.arc(x+2,y+3,6,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.strokeStyle='#9ca3af';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.stroke()}
}
function drawPiece(i,t){
  const b=B[i],tm=i<6?0:1,sel=drag&&drag.i===i,mine=canAct()&&tm===myIdx()&&(carrier<0||i===carrier);
  b.pu=Math.max(0,(b.pu||0)-fdt*5);const sc=1+b.pu*.16+(sel?.08:0);
  ctx.save();ctx.translate(b.x,b.y);
  ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(3,5,PR,PR*.85,0,0,7);ctx.fill();
  ctx.scale(sc,sc);
  if(mine&&!sel){ctx.save();ctx.rotate(t/700);ctx.strokeStyle='rgba(147,197,253,.85)';ctx.lineWidth=2;ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(0,0,PR+7+Math.sin(t/250)*1.5,0,7);ctx.stroke();ctx.restore()}
  if(mine||sel){ctx.shadowColor=sel?'#fde047':'#60a5fa';ctx.shadowBlur=14+5*Math.sin(t/250)}
  const gr=ctx.createRadialGradient(-6,-7,2,0,0,PR);gr.addColorStop(0,tm?'#ff8a80':'#7fb0ff');gr.addColorStop(.55,COL[tm]);gr.addColorStop(1,tm?'#8f1d17':'#0f2f8f');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,PR,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.88)';ctx.fillRect(-PR+2,-6,PR*2-4,12);
  ctx.strokeStyle=i%6===0?'#fde047':'#fff';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,0,PR,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,PR-4,0,7);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(-6,-9,6,3,-.6,0,7);ctx.fill();
  ctx.fillStyle='#111827';ctx.font='bold 11px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(i%6+1,0,1);
  if(carrier===i&&!sim){ctx.strokeStyle='#fde047';ctx.lineWidth=3;ctx.shadowColor='#fde047';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(0,0,PR+6+2*Math.sin(t/150),0,7);ctx.stroke()}
  ctx.restore();
}
function drawBall(bx,by){
  ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(bx+3,by+4,BR,BR*.8,0,0,7);ctx.fill();
  ctx.save();ctx.translate(bx,by);ctx.rotate(ballRot);
  const gr=ctx.createRadialGradient(-3,-3,1,0,0,BR);gr.addColorStop(0,'#fff');gr.addColorStop(1,'#cfd4dc');
  ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,BR,0,7);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();for(let k=0;k<5;k++){const a=k*1.2566-1.57;ctx.lineTo(Math.cos(a)*3.2,Math.sin(a)*3.2)}ctx.fill();
  for(let k=0;k<5;k++){const a=k*1.2566-1.57;ctx.beginPath();ctx.arc(Math.cos(a)*7.4,Math.sin(a)*7.4,2.2,0,7);ctx.fill()}
  ctx.restore();ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(bx,by,BR,0,7);ctx.stroke();
}
function drawAim(){
  if(!drag)return;const b=B[drag.i],p=aimOf(drag),col=p.pw>.85?'#ef4444':p.pw>.5?'#fde047':'#86efac';
  ctx.strokeStyle='#ffffff40';ctx.lineWidth=3;ctx.setLineDash([4,6]);ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle=col;ctx.lineWidth=4;ctx.beginPath();ctx.arc(b.x,b.y,PR+10,-Math.PI/2,-Math.PI/2+p.pw*Math.PI*2);ctx.stroke();
  const L=30+p.pw*170;ctx.fillStyle=col;
  for(let d=PR+8,k=0;d<L;d+=14,k++){ctx.globalAlpha=1-d/(L+30);ctx.beginPath();ctx.arc(b.x+p.dx*d,b.y+p.dy*d,3.2-k*.1,0,7);ctx.fill()}
  ctx.globalAlpha=1;const ex=b.x+p.dx*L,ey=b.y+p.dy*L,a=Math.atan2(p.dy,p.dx);
  ctx.beginPath();ctx.moveTo(ex+p.dx*12,ey+p.dy*12);ctx.lineTo(ex+Math.cos(a+2.6)*12,ey+Math.sin(a+2.6)*12);ctx.lineTo(ex+Math.cos(a-2.6)*12,ey+Math.sin(a-2.6)*12);ctx.fill();
}
function draw(dt,t){
  fdt=dt;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,CW,CH);
  if(myIdx()===1){ctx.translate(CW,CH);ctx.rotate(Math.PI)}
  shake=Math.max(0,shake-dt);cheer=Math.max(.1,cheer-dt*.35);netK=Math.max(0,netK-dt*1.2);
  ctx.translate(MX+(Math.random()-.5)*shake*20,MY+(Math.random()-.5)*shake*20);
  drawField(t);
  const bl=B[12],sp=Math.hypot(bl.vx,bl.vy);ballRot+=sp*dt/BR*(bl.vx>=0?1:-1);
  if(sp>140)trail.push({x:bl.x,y:bl.y,l:1});
  trail=trail.filter(p=>(p.l-=dt*4)>0);trail.forEach(p=>{ctx.fillStyle=`rgba(255,255,255,${p.l*.4})`;ctx.beginPath();ctx.arc(p.x,p.y,BR*p.l,0,7);ctx.fill()});
  rings=rings.filter(r=>(r.l-=dt*2.2)>0);rings.forEach(r=>{ctx.globalAlpha=r.l;ctx.strokeStyle=r.c;ctx.lineWidth=3*r.l+1;ctx.beginPath();ctx.arc(r.x,r.y,r.max*(1-r.l),0,7);ctx.stroke()});ctx.globalAlpha=1;
  for(let i=0;i<12;i++)drawPiece(i,t);
  const sk=Math.max(0,snap.k);snap.k-=dt*6;drawBall(bl.x+snap.dx*sk,bl.y+snap.dy*sk);
  drawAim();
  parts=parts.filter(p=>(p.l-=dt*1.2)>0);parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,5)});ctx.globalAlpha=1;
  ctx.setTransform(1,0,0,1,0,0);if(flash>0){ctx.fillStyle=`rgba(255,235,140,${flash*.35})`;ctx.fillRect(0,0,CW,CH);flash=Math.max(0,flash-dt*1.6)}
  setLabel(label);bumpScores();pill();
  const f=sim||busy||win>=0||!role?1:Math.max(0,tLeft/TL),tf=$('tfill');tf.style.transform=`scaleX(${f})`;tf.style.background=f>.5?'#22c55e':f>.2?'#facc15':'#ef4444';
}

// ---- main loop ----
let lastT=0,looping=false;
function timerStep(dt){if(!role||sim||busy||win>=0||!$('ov').classList.contains('hide'))return;tLeft-=dt;if(tLeft>0)return;tLeft=TL;drag=null;
  if(turn===myIdx()){turn=1-turn;carrier=-1;chain=0;seq++;label='time’s up!';setTimeout(()=>{if(label==='time’s up!')label=''},1200);publish();after()}}
function loop(){if(looping)return;looping=true;
  const tick=t=>{const dt=Math.min(.05,(t-lastT)/1000||.016);lastT=t;
    if(sim)simFrame(dt);else timerStep(dt);
    if(botT>0&&!sim&&!busy){botT-=dt;if(botT<=0)botMove()}
    draw(dt,t);requestAnimationFrame(tick)};
  requestAnimationFrame(tick)}

// ---- boot ----
buildField();layout();hud();draw(0,0);
$('menu').innerHTML='<h1><span class="ball">⚽</span> table soccer</h1><p>checking your wolfchat login…</p>';
let booted=false;
onAuthStateChanged(auth,usr=>{authed=!!(usr&&me&&me.name);if(authed){names[0]=me.displayName||me.name;pfps[0]=me.pfp||'';hud()}if(!booted||!role){booted=true;menu()}});
setTimeout(()=>{if(!booted){booted=true;menu()}},4000);
loop();
</script>
