<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>word duel · wolfchat</title>
<link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
<style>
:root{--grass:#2fd44a;--grass2:#27b83f;--ink:#000;--paper:#fff;--blue:#2d9cf0;--red:#e5334b;--gold:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Minecraftia',monospace;color:#fff;background:#5a6a7a;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* ---------- scene ---------- */
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#7d8da0 0%,#9fb0c4 34%,#b7c9d6 40%,var(--grass) 41%,var(--grass2) 100%)}
#scene::before{content:"";position:absolute;left:-20%;right:-20%;top:40%;bottom:-30%;
  background:
   radial-gradient(circle at 50% 38%,rgba(255,255,255,.22) 0 3px,transparent 4px) 0 0/34px 34px,
   linear-gradient(rgba(0,0,0,.10) 2px,transparent 2px) 0 0/68px 68px,
   linear-gradient(90deg,rgba(0,0,0,.10) 2px,transparent 2px) 0 0/68px 68px,
   var(--grass);
  transform:perspective(520px) rotateX(58deg);transform-origin:50% 0}
#scene::after{content:"";position:absolute;inset:0;backdrop-filter:blur(5px);background:radial-gradient(ellipse at 50% 70%,transparent 40%,rgba(0,0,0,.28))}
.tree{position:absolute;bottom:42%;width:90px;image-rendering:pixelated;opacity:.9;filter:blur(1.5px)}
.tree i{display:block;margin:0 auto;background:#1fa73a;box-shadow:inset -8px -8px 0 rgba(0,0,0,.14),inset 8px 8px 0 rgba(255,255,255,.12)}
.tree i:nth-child(1){width:34%;height:22px}.tree i:nth-child(2){width:62%;height:26px}.tree i:nth-child(3){width:90%;height:30px}
.tree b{display:block;margin:0 auto;width:22%;height:44px;background:#8a4b21;box-shadow:inset -6px 0 rgba(0,0,0,.2)}
.fence{position:absolute;bottom:41%;height:34px;border-top:8px solid #b9611f;border-bottom:8px solid #b9611f;filter:blur(1px)}

/* outlined pixel text */
.ol{color:#fff;text-shadow:4px 0 #000,-4px 0 #000,0 4px #000,0 -4px #000,3px 3px #000,-3px 3px #000,3px -3px #000,-3px -3px #000,0 6px 0 rgba(0,0,0,.35)}
.ol.sm{text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000,2px 2px #000,-2px 2px #000,2px -2px #000,-2px -2px #000}

/* ---------- layout ---------- */
.view{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:2;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.view.on{display:flex}
#title{margin-top:clamp(14px,4vh,40px);font-size:clamp(22px,5.2vw,54px);text-align:center;padding:0 12px;line-height:1.2;min-height:1.2em}
#sub{margin-top:10px;font-size:clamp(11px,1.8vw,16px);text-align:center;min-height:1.4em;padding:0 12px}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:100%;padding:0 12px;min-height:0}

/* letter tiles */
.tiles{display:flex;gap:clamp(8px,1.6vw,18px);flex-wrap:wrap;justify-content:center}
.tile{width:clamp(62px,9.5vw,112px);height:clamp(62px,9.5vw,112px);border-radius:14px;background:var(--paper);border:3px solid #000;color:#000;font-size:clamp(30px,5vw,58px);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
button.tile:hover{transform:translateY(-6px) rotate(-2deg);box-shadow:0 12px 0 rgba(0,0,0,.3)}
button.tile:active{transform:translateY(2px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.tile.big{width:clamp(70px,10vw,116px);height:clamp(70px,10vw,116px);font-size:clamp(36px,5.6vw,66px);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.tile.dim{opacity:.65;cursor:default}
@keyframes pop{from{transform:scale(.3) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}

/* typing */
#typeRow{display:none;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
#typeRow.on{display:flex}
#word{width:min(78vw,460px);height:clamp(54px,8vw,74px);border-radius:14px;border:3px solid #000;background:#fff;color:#000;font-family:inherit;font-size:clamp(20px,3.4vw,34px);text-align:center;text-transform:lowercase;outline:none;box-shadow:0 6px 0 rgba(0,0,0,.35)}
#word::placeholder{color:#9aa}
#word:focus{box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 0 4px var(--gold)}
#word.shake{animation:shake .38s}
@keyframes shake{20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
#waitTxt{font-size:clamp(14px,2.4vw,24px);text-align:center;line-height:1.5}
#flash{min-height:1.4em;font-size:clamp(12px,1.9vw,18px);color:#ffd9de}
#lg{font-size:clamp(10px,1.5vw,14px);opacity:.95;min-height:1.3em;text-align:center}

/* avatar + decoration */
.av{position:relative;flex:none;width:var(--s,64px);height:var(--s,64px)}
.av .pf{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #000;background:#0b1f4b;display:block}
.av .dc{position:absolute;left:-10%;top:-10%;width:120%;height:120%;max-width:none;object-fit:contain;pointer-events:none}
.av .dc[hidden]{display:none}

/* stage (active player) */
#stage{display:flex;flex-direction:column;align-items:center;position:relative;margin-bottom:clamp(60px,11vh,96px);flex:none}
#stage .av{--s:clamp(110px,17vh,170px)}
#stageName{margin-top:14px;font-size:clamp(14px,2.2vw,22px);text-align:center;max-width:90vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#stageUser{font-size:clamp(9px,1.3vw,12px);opacity:.9;margin-top:4px}
#clock{position:absolute;left:50%;top:clamp(86px,13.5vh,138px);transform:translateX(-50%);width:clamp(64px,10vh,92px);height:clamp(64px,10vh,92px);border-radius:50%;
  background:conic-gradient(var(--blue) var(--p,100%),#fff 0);border:4px solid #1b1b1b;display:grid;place-items:center}
#clock::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
#clock::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:30%;background:#8aa4b8;transform-origin:50% 100%;transform:translate(-50%,-100%) rotate(var(--r,0deg));border-radius:3px}
#clock span{position:relative;z-index:1;font-size:clamp(14px,2.4vh,20px);color:#000;text-shadow:-1px 0 #fff,1px 0 #fff,0 1px #fff,0 -1px #fff,0 0 3px #fff}
#clock.low{background:conic-gradient(var(--red) var(--p,100%),#fff 0);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:translateX(-50%) scale(1.08)}}

/* hearts & orbs */
#hearts{position:fixed;left:clamp(8px,2vw,24px);bottom:calc(env(safe-area-inset-bottom) + clamp(8px,2vh,22px));display:flex;gap:6px;z-index:3}
.heart{width:clamp(44px,7vw,84px);height:clamp(44px,7vw,84px);transition:transform .2s,filter .2s}
.heart.lost{filter:grayscale(1) brightness(.55);transform:scale(.8)}
#orbs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + clamp(8px,2vh,22px));display:flex;gap:clamp(4px,1vw,12px);padding:8px 14px;background:#2cf06a;border:5px solid #000;border-radius:6px;box-shadow:0 0 0 4px #1d9e47 inset;z-index:3}
.orb{width:clamp(36px,6vw,70px);height:clamp(36px,6vw,70px);border-radius:50%;border:3px solid #7c2330;background:radial-gradient(circle at 35% 30%,#ff9aa8,#c64458 55%,#a02e42);display:grid;place-items:center;color:#7c2330;font-size:clamp(20px,4vw,40px);transition:.2s}
.orb.live{background:radial-gradient(circle at 35% 30%,#fff,#bfffd0 60%,#7de39b);border-color:#1a7a3a;color:transparent}
.orb.live::after{content:""}
.orb.used::after{content:"X"}
.orb.just{animation:pop .35s}

/* player list */
#plist{position:fixed;left:clamp(8px,1.5vw,20px);top:calc(env(safe-area-inset-top) + clamp(60px,12vh,110px));display:flex;flex-direction:column;gap:8px;z-index:3;max-width:44vw}
.pc{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 8px;border-radius:30px;background:rgba(0,0,0,.45);border:2px solid transparent;font-size:clamp(9px,1.3vw,13px);transition:.2s}
.pc .av{--s:clamp(30px,4.2vw,44px)}
.pc.act{border-color:var(--gold);background:rgba(0,0,0,.65);box-shadow:0 0 14px rgba(255,210,63,.55)}
.pc.out{opacity:.45;filter:grayscale(.8)}
.pc .nm{max-width:18ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .hs{display:flex;gap:2px;margin-top:3px}
.pc .hs svg{width:13px;height:13px}
.pc .hs svg.lost{filter:grayscale(1) brightness(.5)}

/* menus */
.panel{background:rgba(0,0,0,.55);border:3px solid #000;border-radius:16px;padding:clamp(14px,2.4vw,26px);width:min(92vw,560px);backdrop-filter:blur(6px)}
.btn{font-size:clamp(12px,1.8vw,17px);padding:14px 22px;border-radius:12px;border:3px solid #000;background:#fff;color:#000;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 0 rgba(0,0,0,.35)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn.go{background:var(--grass);}
.btn.warn{background:#ffb3bd}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.rules{font-size:clamp(9px,1.35vw,12px);line-height:1.9;opacity:.95;text-align:center;margin-top:10px}
.rooms{display:flex;flex-direction:column;gap:8px;margin-top:14px;max-height:30vh;overflow:auto}
.rm{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.12);border-radius:10px;padding:8px 12px;font-size:12px}
.rm .btn{padding:8px 14px;font-size:11px}
.empty{font-size:11px;opacity:.75;text-align:center;padding:10px}
.lobbyPlayers{display:flex;gap:clamp(14px,3vw,36px);justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
.lp{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;max-width:140px;text-align:center}
.lp .av{--s:clamp(72px,11vw,110px)}
.slot{width:clamp(72px,11vw,110px);height:clamp(72px,11vw,110px);border-radius:50%;border:3px dashed rgba(255,255,255,.55);display:grid;place-items:center;font-size:28px;opacity:.7}

/* winner */
#over{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;backdrop-filter:blur(4px);text-align:center;padding:16px}
#over.on{display:flex}
#over .av{--s:clamp(130px,22vh,200px);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
#over h2{font-size:clamp(24px,6vw,56px)}
#toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;z-index:20;font-size:clamp(13px,2.4vw,22px);padding:10px 18px;background:#000;border-radius:10px;transition:.2s;text-align:center;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-height:620px){#mid{gap:8px}#stage{margin-bottom:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="scene">
  <div class="tree" style="left:6%"><i></i><i></i><i></i><b></b></div>
  <div class="tree" style="left:14%;width:70px;bottom:44%"><i></i><i></i><i></i><b></b></div>
  <div class="tree" style="right:8%;width:110px"><i></i><i></i><i></i><b></b></div>
  <div class="fence" style="left:58%;right:0"></div>
</div>

<!-- LOBBY -->
<div class="view" id="vLobby">
  <h1 id="lobTitle" class="ol" style="margin-top:clamp(20px,7vh,70px);font-size:clamp(30px,7vw,70px)">word duel</h1>
  <div id="mid">
    <div class="panel">
      <div id="who" style="text-align:center;font-size:12px"></div>
      <div class="rules">pick a letter. type a word that starts with it. <br>15 seconds · 5 guesses a word · 3 lives each.<br>last player standing wins.</div>
      <div class="row"><button class="btn go" id="bCreate">create game</button></div>
      <div class="rooms" id="rooms"></div>
    </div>
  </div>
</div>

<!-- WAITING ROOM -->
<div class="view" id="vWait">
  <h1 class="ol" style="margin-top:clamp(20px,7vh,70px);font-size:clamp(26px,5.5vw,56px);text-align:center">waiting for players</h1>
  <div id="mid">
    <div class="lobbyPlayers" id="lobbyPlayers"></div>
    <div id="waitHint" class="ol sm" style="font-size:clamp(11px,1.8vw,16px);text-align:center;line-height:1.7"></div>
    <div class="row">
      <button class="btn go" id="bStart">start game</button>
      <button class="btn warn" id="bLeaveW">leave</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div class="view" id="vGame">
  <div id="title" class="ol"></div>
  <div id="sub" class="ol sm"></div>
  <aside id="plist"></aside>
  <div id="mid">
    <div class="tiles" id="opts"></div>
    <div id="typeRow">
      <div class="tile big" id="bigL">E</div>
      <input id="word" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="30" placeholder="type your word, press enter">
    </div>
    <div id="waitTxt" class="ol sm"></div>
    <div id="flash"></div>
    <div id="lg" class="ol sm"></div>
  </div>
  <div id="stage">
    <div id="stageAv"></div>
    <div id="clock"><span id="clockT">15.0</span></div>
    <div id="stageName" class="ol sm"></div>
    <div id="stageUser" class="ol sm"></div>
  </div>
  <div id="hearts"></div>
  <div id="orbs"></div>
  <button class="btn warn" id="bLeaveG" style="position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:4;padding:8px 14px;font-size:11px">leave</button>
</div>

<div id="over"><div id="overAv"></div><h2 class="ol" id="overTxt"></h2><div id="overSub" class="ol sm" style="font-size:13px"></div><button class="btn go" id="bBack">back to lobby</button></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, get, onValue, set, remove, runTransaction, push } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ---------- same firebase project + account as wolfchat (index.html) ---------- */
const CFG = {
  apiKey: "AIzaSyBg5DGLubsHuH3ub3AtzpRenSMH6x1hZPs",
  authDomain: "wolfchatlol.firebaseapp.com",
  databaseURL: "https://wolfchatlol-default-rtdb.firebaseio.com",
  projectId: "wolfchatlol",
  storageBucket: "wolfchatlol.firebasestorage.app",
  messagingSenderId: "654485297853",
  appId: "1:654485297853:web:b1b93e7d7cef780fd275d4"
};
const ACTIVE = localStorage.getItem("wc_active") || "main";
const app = ACTIVE === "main" ? initializeApp(CFG) : initializeApp(CFG, ACTIVE);
const db = getDatabase(app), auth = getAuth(app);
const PKEY = ACTIVE === "main" ? "wc_profile" : "wc_profile_" + ACTIVE;

const $ = id => document.getElementById(id);
const h = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* ---------- constants ---------- */
const LIVES = 3, GUESSES = 5, SECS = 15, MAXP = 3, MINLEN = 3;
const POOL = "EEEEEEAAAAAIIIIOOOOTTTTNNNRRRSSSSLLLCCCDDDPPPMMMHHHBBBGGGFFFUUUWWWYYKKVVJZQX";
const DECOR_DIR = "assets/avatardecor/", DECOR_CDN = "https://cdn.jsdelivr.net/gh/wolfiinator/wolfchatrevival@main/assets/avatardecor/";
const okDecor = f => typeof f === "string" && /^[\w .()\-]{1,80}\.(gif|png|webp|apng)$/i.test(f);
const safeImg = s => typeof s === "string" && /^(data:image\/|https:\/\/)/.test(s) ? s : "";
const letterAvatar = n => "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect width="96" height="96" fill="#0b1f4b"/><text x="48" y="64" font-size="48" text-anchor="middle" fill="#93c5fd" font-family="monospace">${(n || "?")[0].toUpperCase()}</text></svg>`);

/* ---------- time sync ---------- */
let offset = 0; onValue(ref(db, ".info/serverTimeOffset"), s => offset = s.val() || 0);
const now = () => Date.now() + offset;

/* ---------- identity ---------- */
let me = null, myProf = null;
const profCache = {};
function loadMe() {
  try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p && (p.name || p.username)) return { name: String(p.name || p.username).replace(/[^\w-]/g, ""), displayName: p.displayName || "", pfp: safeImg(p.pfp), decor: okDecor(p.decor) ? p.decor : "" }; } catch {}
  return null;
}
async function prof(name) {
  if (name === me) return myProf;
  if (profCache[name]) return profCache[name];
  const fall = { name, displayName: "", pfp: "", decor: "" };
  profCache[name] = fall;
  try {
    const v = (await get(ref(db, "profiles/" + name))).val() || {};
    profCache[name] = { name, displayName: String(v.displayName || "").slice(0, 32), pfp: safeImg(v.pfp), decor: okDecor(v.decor) ? v.decor : "" };
    if (room) renderAll();
  } catch {}
  return profCache[name];
}
const P = n => n === me ? myProf : (profCache[n] || (prof(n), { name: n, displayName: "", pfp: "", decor: "" }));

function avatar(name, size) {
  const p = P(name), w = h("div", "av"); if (size) w.style.setProperty("--s", size);
  const i = h("img", "pf"); i.alt = ""; i.src = p.pfp || letterAvatar(name); i.onerror = () => { i.onerror = null; i.src = letterAvatar(name); };
  const d = h("img", "dc"); d.alt = ""; d.hidden = !p.decor;
  if (p.decor) { d.src = DECOR_DIR + encodeURIComponent(p.decor); d.onerror = () => { d.onerror = null; d.src = DECOR_CDN + encodeURIComponent(p.decor); }; }
  w.append(i, d); return w;
}
const dispName = n => P(n).displayName || n;
const heartSVG = () => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 22"); s.innerHTML = '<path d="M12 21C-6 8 4-3 12 5c8-8 18 3 0 16z" fill="#e5334b" stroke="#6b0f1d" stroke-width="1.6" stroke-linejoin="round"/><ellipse cx="7" cy="7" rx="3" ry="2" fill="#fff" opacity=".55" transform="rotate(-30 7 7)"/>'; return s; };

/* ---------- sound ---------- */
let ac; const beep = (f, d = .12, t = "square", v = .05) => { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = t; o.frequency.value = f; g.gain.value = v; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d); o.stop(ac.currentTime + d); } catch {} };
const sfx = { ok: () => { beep(660); setTimeout(() => beep(880), 90); }, bad: () => beep(150, .25, "sawtooth"), tick: () => beep(1000, .05, "square", .03), life: () => { beep(300, .2, "sawtooth"); setTimeout(() => beep(200, .3, "sawtooth"), 150); }, win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .2), i * 120)) };

let toastT; function toast(m, ms = 1800) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function flash(m) { $("flash").textContent = m; const w = $("word"); w.classList.remove("shake"); void w.offsetWidth; w.classList.add("shake"); sfx.bad(); }

/* ---------- db paths (games/wordduel/<id> fits the existing "games/<room>/<id>" rules) ---------- */
const BASE = "games/wordduel";
const rref = id => ref(db, `${BASE}/${id || roomId}`);
let roomId = null, room = null, roomUn = null, all = {}, lastN = -1, lastBad = 0, lastPhase = "";

onValue(ref(db, BASE), s => { all = s.val() || {}; if (!roomId) renderLobby(); });

function listenRoom(id) {
  roomUn?.(); roomId = id; room = null; lastN = -1; lastBad = 0;
  roomUn = onValue(rref(), s => { room = s.val(); if (!room) { if (roomId) { toast("game closed"); leaveView(); } return; } renderAll(); });
}
function leaveView() { roomUn?.(); roomUn = null; roomId = null; room = null; $("over").classList.remove("on"); show("vLobby"); renderLobby(); }

const tx = fn => runTransaction(rref(), cur => cur === null ? cur : fn(cur)).catch(() => {});
const genOpts = () => { const o = []; while (o.length < 4) { const c = POOL[Math.random() * POOL.length | 0]; if (!o.includes(c)) o.push(c); } return o; };
const alive = g => (g.ord || []).filter(n => (g.lives?.[n] ?? 0) > 0);
function nextTurn(g, from, lg) {
  const o = g.ord, i = o.indexOf(from);
  for (let k = 1; k <= o.length; k++) { const c = o[(i + k) % o.length]; if (g.lives[c] > 0) { g.turn = c; break; } }
  g.ph = "pick"; g.opts = genOpts(); g.L = ""; g.dl = now() + SECS * 1000; g.gl = GUESSES; g.n++; g.lg = lg || "";
}
function lifeLost(g, who, lg) {
  g.lives[who] = Math.max(0, (g.lives[who] || 0) - 1);
  g.lost = (g.lost || 0) + 1;
  const a = alive(g);
  if (a.length <= 1) { g.st = "done"; g.win = a[0] || null; g.turn = null; g.lg = lg; g.n++; return g; }
  nextTurn(g, who, lg + (g.lives[who] ? "" : ` · ${who} is out!`)); return g;
}

/* ---------- lobby actions ---------- */
async function createGame() {
  const id = push(ref(db, BASE)).key;
  try {
    await set(rref(id), { type: "wordduel", host: me, st: "open", ts: now(), pl: { [me]: true }, n: 0 });
    listenRoom(id);
  } catch { toast("couldn't create (check firebase rules for games/)", 4000); }
}
async function joinGame(id) {
  const r = await runTransaction(rref(id), g => {
    if (!g || g.st !== "open") return;
    g.pl = g.pl || {};
    if (!g.pl[me] && Object.keys(g.pl).length >= MAXP) return;
    g.pl[me] = true; return g;
  }).catch(() => null);
  if (r?.committed) listenRoom(id); else toast("can't join that game");
}
async function startGame() {
  if (!room || room.host !== me) return;
  await tx(g => {
    if (g.st !== "open") return;
    const ord = Object.keys(g.pl || {}); if (ord.length < 2) return;
    for (let i = ord.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[ord[i], ord[j]] = [ord[j], ord[i]]; }
    g.ord = ord; g.lives = {}; ord.forEach(n => g.lives[n] = LIVES);
    g.st = "live"; g.turn = ord[0]; g.ph = "pick"; g.opts = genOpts(); g.L = ""; g.dl = now() + SECS * 1000; g.gl = GUESSES; g.used = null; g.bad = 0; g.lost = 0; g.n = 1; g.lg = "game on!"; g.win = null;
    return g;
  });
}
async function leaveGame() {
  const id = roomId, g = room;
  if (g && g.st === "open") {
    if (g.host === me) await remove(rref(id)).catch(() => {});
    else await tx(c => { if (c.pl) delete c.pl[me]; return c; });
  } else if (g && g.st === "live" && g.lives?.[me] > 0) {
    await tx(c => {
      if (c.st !== "live" || !(c.lives[me] > 0)) return;
      const wasTurn = c.turn === me; c.lives[me] = 0;
      const a = alive(c);
      if (a.length <= 1) { c.st = "done"; c.win = a[0] || null; c.turn = null; c.lg = `${me} left`; c.n++; return c; }
      if (wasTurn) nextTurn(c, me, `${me} left`); else c.lg = `${me} left`;
      return c;
    });
  } else if (g && g.st === "done" && g.host === me) await remove(rref(id)).catch(() => {});
  leaveView();
}

/* ---------- in-game actions ---------- */
function pick(L) {
  const n = room.n; if (room.turn !== me || room.ph !== "pick") return;
  tx(g => { if (g.n !== n || g.ph !== "pick" || g.turn !== me || !g.opts.includes(L)) return; g.ph = "type"; g.L = L; g.dl = now() + SECS * 1000; g.gl = GUESSES; g.n++; g.lg = `${me} picked ${L}`; return g; });
}
let busy = false;
async function submit() {
  if (busy || !room || room.st !== "live" || room.turn !== me || room.ph !== "type") return;
  const w = $("word").value.trim().toLowerCase(), L = room.L.toLowerCase();
  if (!w) return;
  if (!/^[a-z]+$/.test(w)) return flash("letters only");
  if (w[0] !== L) return flash(`must start with ${L.toUpperCase()}`);
  if (w.length < MINLEN) return flash(`at least ${MINLEN} letters`);
  if (room.used?.[w]) return flash("already used this game");
  busy = true; $("flash").textContent = "checking…";
  const v = await isWord(w); busy = false; $("flash").textContent = "";
  if (v === null) return toast("couldn't check that word — try again", 2500);
  const n = room.n;
  await tx(g => {
    if (g.n !== n || g.turn !== me || g.ph !== "type" || g.st !== "live" || now() > g.dl + 600) return;
    if (v) { g.used = g.used || {}; g.used[w] = true; nextTurn(g, me, `${me} played “${w}” ✓`); return g; }
    g.gl--; g.bad = (g.bad || 0) + 1; g.lg = `${me} tried “${w}” ✗`;
    if (g.gl <= 0) return lifeLost(g, me, `${me} ran out of guesses`);
    return g;
  });
  if (v) { $("word").value = ""; }
}
function expire(n) {
  tx(g => {
    if (g.n !== n || g.st !== "live" || now() < g.dl - 400) return;
    if (g.ph === "pick") { const L = g.opts[Math.random() * g.opts.length | 0]; g.ph = "type"; g.L = L; g.dl = now() + SECS * 1000; g.gl = GUESSES; g.n++; g.lg = `${g.turn} didn't pick — random ${L}`; return g; }
    return lifeLost(g, g.turn, `${g.turn} ran out of time`);
  });
}

/* ---------- word check: dictionaryapi.dev + datamuse (either says yes = real word) ---------- */
const wcache = {};
async function isWord(w) {
  if (w in wcache) return wcache[w];
  const to = (u) => { const c = new AbortController(); setTimeout(() => c.abort(), 6000); return fetch(u, { signal: c.signal }); };
  const a = to(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w)}`).then(r => r.ok ? true : r.status === 404 ? false : null).catch(() => null);
  const b = to(`https://api.datamuse.com/words?sp=${encodeURIComponent(w)}&max=1`).then(r => r.ok ? r.json() : null).then(j => j ? (j[0]?.word === w) : null).catch(() => null);
  const [x, y] = await Promise.all([a, b]);
  const r = (x === true || y === true) ? true : (x === false && y === false) ? false : (x === false && y === null) || (x === null && y === false) ? false : null;
  if (r !== null) wcache[w] = r; return r;
}

/* ---------- rendering ---------- */
function show(id) { document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id)); }

function renderLobby() {
  show("vLobby");
  $("who").textContent = me ? `playing as ${myProf.displayName || me} (@${me})` : "";
  const box = $("rooms"); box.replaceChildren();
  const open = Object.entries(all).filter(([, g]) => g && g.type === "wordduel" && g.st === "open" && now() - (g.ts || 0) < 30 * 60e3);
  if (!open.length) { box.append(h("div", "empty", "no open games. make one and a friend can join from here.")); return; }
  open.forEach(([id, g]) => {
    const r = h("div", "rm"), c = Object.keys(g.pl || {}).length;
    r.append(h("span", "", `${g.host}'s game · ${c}/${MAXP}`));
    const b = h("button", "btn", g.pl?.[me] ? "rejoin" : "join"); if (c >= MAXP && !g.pl?.[me]) b.disabled = true;
    b.onclick = () => joinGame(id); r.append(b); box.append(r);
  });
}

function renderAll() {
  if (!room) return;
  (room.ord || Object.keys(room.pl || {})).forEach(n => P(n));
  if (room.st === "open") return renderWait();
  renderGame();
}

function renderWait() {
  show("vWait"); $("over").classList.remove("on");
  const box = $("lobbyPlayers"); box.replaceChildren();
  const pl = Object.keys(room.pl || {});
  pl.forEach(n => { const d = h("div", "lp"); d.append(avatar(n), h("div", "ol sm", dispName(n) + (n === room.host ? " ★" : ""))); box.append(d); });
  for (let i = pl.length; i < MAXP; i++) box.append(Object.assign(h("div", "slot", i < 2 ? "?" : "+"), {}));
  const isHost = room.host === me;
  $("bStart").style.display = isHost ? "" : "none"; $("bStart").disabled = pl.length < 2;
  $("waitHint").textContent = pl.length < 2 ? "need at least 2 players to start (up to 3 can play)" : isHost ? "ready when you are!" : `waiting for ${room.host} to start…`;
}

let tickKey = "";
function renderGame() {
  show("vGame");
  const g = room, mine = g.turn === me, live = g.st === "live";

  // title/sub
  const t = $("title"), who = g.turn ? dispName(g.turn) : "";
  if (live && g.ph === "pick") t.textContent = mine ? `${who}, pick a letter` : `${who} is picking a letter…`;
  else if (live) t.textContent = mine ? "Type a word starting with…" : `${who}: word starting with ${g.L}`;
  else t.textContent = "game over";
  $("sub").textContent = live ? (g.ord.length > 2 ? "last one standing wins" : "") : "";

  // letter options / typing row
  const opts = $("opts"); opts.replaceChildren();
  const tr = $("typeRow");
  if (live && g.ph === "pick") {
    (g.opts || []).forEach(L => { const b = h(mine ? "button" : "div", "tile" + (mine ? "" : " dim"), L); if (mine) b.onclick = () => { sfx.tick(); pick(L); }; opts.append(b); });
    tr.classList.remove("on");
  } else if (live) {
    $("bigL").textContent = g.L;
    tr.classList.add("on");
    $("word").style.display = mine ? "" : "none";
    if (mine) { $("word").placeholder = `a word starting with ${g.L}…`; if (lastPhase !== g.n + g.ph) { $("word").value = ""; $("flash").textContent = ""; setTimeout(() => $("word").focus(), 30); } }
    $("bigL").classList.toggle("dim", !mine);
  } else tr.classList.remove("on");
  lastPhase = g.n + g.ph;

  $("waitTxt").textContent = live && !mine ? `waiting for ${who}…` : "";
  $("lg").textContent = g.lg || "";
  if (mine) { if (!($("flash").textContent)) $("flash").textContent = ""; } else $("flash").textContent = "";

  // stage = active player (or winner)
  const sp = g.turn || g.win;
  const sa = $("stageAv"); sa.replaceChildren(); if (sp) sa.append(avatar(sp));
  $("stageName").textContent = sp ? dispName(sp) : "";
  $("stageUser").textContent = sp ? "@" + sp : "";
  $("clock").style.display = live ? "" : "none";

  // hearts + orbs of active player
  const hb = $("hearts"); hb.replaceChildren();
  const lv = sp ? (g.lives?.[sp] ?? 0) : 0;
  for (let i = 0; i < LIVES; i++) { const s = heartSVG(); s.classList.add("heart"); if (i >= lv) s.classList.add("lost"); hb.append(s); }
  const ob = $("orbs"); ob.replaceChildren();
  const left = live && g.ph === "type" ? g.gl : live ? GUESSES : 0;
  for (let i = 0; i < GUESSES; i++) { const o = h("div", "orb " + (i < left ? "live" : "used")); if (i === left && g.bad !== lastBad) o.classList.add("just"); ob.append(o); }

  // players list
  const pl = $("plist"); pl.replaceChildren();
  (g.ord || []).forEach(n => {
    const c = h("div", "pc" + (n === g.turn && live ? " act" : "") + (g.lives[n] > 0 ? "" : " out"));
    c.append(avatar(n));
    const d = h("div"); d.append(h("div", "nm ol sm", dispName(n)));
    const hs = h("div", "hs"); for (let i = 0; i < LIVES; i++) { const s = heartSVG(); if (i >= g.lives[n]) s.classList.add("lost"); hs.append(s); } d.append(hs);
    c.append(d); pl.append(c);
  });

  // sfx on state change
  if (g.n !== lastN && lastN !== -1) { if ((g.lost || 0) > (renderGame.lost || 0)) sfx.life(); else if (g.lg?.includes("✓")) sfx.ok(); }
  if (g.bad !== lastBad && lastBad !== undefined && g.n === lastN) sfx.bad();
  renderGame.lost = g.lost || 0; lastN = g.n; lastBad = g.bad || 0;

  // game over
  const ov = $("over");
  if (!live) {
    ov.classList.add("on"); $("overAv").replaceChildren(); if (g.win) $("overAv").append(avatar(g.win));
    $("overTxt").textContent = g.win ? (g.win === me ? "you win!" : `${dispName(g.win)} wins!`) : "nobody wins";
    $("overSub").textContent = g.lg || "";
    if (!renderGame.done) { renderGame.done = true; if (g.win === me) sfx.win(); else sfx.life(); }
  } else { ov.classList.remove("on"); renderGame.done = false; }
}

/* ---------- timer loop ---------- */
let expKey = "";
function loop() {
  if (room && room.st === "live") {
    const left = Math.max(0, (room.dl - now()) / 1000);
    $("clockT").textContent = left.toFixed(1);
    $("clock").style.setProperty("--p", (left / SECS * 100) + "%");
    $("clock").style.setProperty("--r", ((SECS - left) / SECS * 360) + "deg");
    $("clock").classList.toggle("low", left <= 5 && left > 0);
    if (room.turn === me && left <= 5 && left > 0 && Math.floor(left) !== loop.s) { loop.s = Math.floor(left); sfx.tick(); }
    if (left <= 0) {
      const k = roomId + ":" + room.n;
      if (k !== expKey) { expKey = k; const n = room.n; setTimeout(() => { if (room && room.n === n && room.st === "live") expire(n); }, room.turn === me ? 50 : 3500); }
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- wiring ---------- */
$("bCreate").onclick = createGame;
$("bStart").onclick = startGame;
$("bLeaveW").onclick = leaveGame;
$("bLeaveG").onclick = () => { if (room?.st === "live" && !confirm("leave the game? you'll be out.")) return; leaveGame(); };
$("bBack").onclick = leaveGame;
$("word").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); submit(); } });
$("word").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^a-zA-Z]/g, ""); });
document.addEventListener("keydown", e => {
  if (!room || room.st !== "live" || room.turn !== me) return;
  if (room.ph === "pick" && /^[a-z]$/i.test(e.key) && !e.ctrlKey && !e.metaKey) { const L = e.key.toUpperCase(); if (room.opts.includes(L)) { sfx.tick(); pick(L); } }
  else if (room.ph === "type" && document.activeElement !== $("word") && /^[a-z]$/i.test(e.key)) $("word").focus();
});

/* ---------- boot ---------- */
function gate(msg) {
  show("vLobby"); $("lobTitle").textContent = "word duel";
  const m = document.querySelector("#vLobby .panel"); m.replaceChildren(h("div", "", msg), Object.assign(h("a", "btn go", "open wolfchat"), { href: "index.html", style: "display:inline-block;margin-top:16px;text-decoration:none" }));
  m.style.textAlign = "center"; m.style.fontSize = "13px"; m.style.lineHeight = "1.8";
}
me = (loadMe() || {}).name ? loadMe().name : null; myProf = loadMe();
if (!me) gate("log in to wolfchat first so we know who you are (same browser, same site).");
else {
  show("vLobby"); renderLobby();
  onAuthStateChanged(auth, u => { if (!u && !roomId) gate("you're signed out of wolfchat. sign in there, then come back."); });
  prof(me); requestAnimationFrame(loop);
}
</script>
